server.port=${PORT:8080}

spring.profiles.active=dev

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=604800000

# CORS - Allow React frontend (can be overridden via APP_CORS_ALLOWED_ORIGINS on Render/production)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.com.financetracker=INFO
logging.level.org.springframework.security=WARN

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB